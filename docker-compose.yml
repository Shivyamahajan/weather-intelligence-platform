version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
  
  frontend:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run src/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0